version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: postgres_db
    environment:
      POSTGRES_DB: authserver
      POSTGRES_USER: auth-server
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
#    volumes:
#      - postgres_data:/var/lib/postgresql/data

  auth-server:
    build: .
    container_name: auth-server
    depends_on:
      - postgres
    ports:
      - "9000:9000"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/authserver
      SPRING_DATASOURCE_USERNAME: auth-server
      SPRING_DATASOURCE_PASSWORD: password