
server:
  port: 9000

spring:
  application:
    name: cloud-identity-provider

  security:
    oauth2:
      authorizationserver:
        issuer: http://gateway:8080

  datasource:
    hikari:
      initializationFailTimeout: 10000
    url: jdbc:postgresql://postgres:5432/auth
    username: auth-server
    password: password

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
