
server:
  port: 9000

spring:
  application:
    name: cloud-identity-provider

  security:
    oauth2:
      authorizationserver:
        issuer: http://localhost:8080

  datasource:
    url: jdbc:h2:mem:authdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
